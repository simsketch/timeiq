name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 9 * * 1" # weekly, so new advisories surface even without commits

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: timeiq
          POSTGRES_PASSWORD: timeiq
          POSTGRES_DB: timeiq_qa_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U timeiq" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Only a local timeiq_qa* database lets the database-backed tests run.
      DATABASE_URL: postgresql+asyncpg://timeiq:timeiq@localhost:5432/timeiq_qa_ci
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt pytest pytest-asyncio pip-audit
      - run: alembic upgrade head
      - run: python -m pytest -q
      - name: Audit Python dependencies
        run: pip-audit -r requirements.txt --progress-spinner off

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - name: Audit npm dependencies
        run: npm audit --audit-level=high
